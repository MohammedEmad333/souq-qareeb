name: Block theme snapshot checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate snapshots and scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate Bash syntax
        run: bash -n scripts/check-block-theme.sh
      - name: Validate PHP syntax
        run: docker run --rm -v "$PWD:/work:ro" -w /work php:8.3-cli php -l scripts/compare-block-theme.php
      - name: Validate snapshot JSON shape
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name, kind in (
              ('header', 'wp_template_part'),
              ('navigation', 'wp_navigation'),
              ('global-styles', 'wp_global_styles'),
          ):
              data = json.loads(Path(f'wordpress/exports/{name}.json').read_text())
              assert data['type'] == kind
              assert isinstance(data['slug'], str) and data['slug']
              assert isinstance(data['content'], str)
              print(f'{name}: valid')
          PY
