name: Deployment script checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bash-syntax:
    name: Validate deployment shell script
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate Bash syntax
        run: |\n          bash -n scripts/deploy-mu-plugins.sh\n          bash -n scripts/production-readonly-audit.sh\n          bash -n scripts/collect-brand-assets.sh\n          bash scripts/production-readonly-audit.sh --help >/dev/null
