name: PHP syntax checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP lint (8.3)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check syntax of custom WordPress plugins
        run: |
          set -euo pipefail
          files=(wordpress/mu-plugins/*.php)
          test -f "${files[0]}"
          for file in "${files[@]}"; do
            echo "Checking $file"
            docker run --rm -v "$PWD:/work:ro" -w /work php:8.3-cli php -l "$file"
          done
