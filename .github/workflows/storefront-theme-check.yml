name: Storefront theme PHP lint
on:
  push:
    paths:
      - 'wordpress/themes/souq-qareeb/**'
      - 'scripts/test-listing-inventory.php'
      - 'scripts/test-catalog-filters.php'
      - 'scripts/test-contact-phone.php'
      - 'scripts/test-moderation-permissions.php'
      - 'scripts/test-stripe-checkout-copy.php'
      - '.github/workflows/storefront-theme-check.yml'
  pull_request:
    paths:
      - 'wordpress/themes/souq-qareeb/**'
      - 'scripts/test-listing-inventory.php'
      - 'scripts/test-catalog-filters.php'
      - 'scripts/test-contact-phone.php'
      - 'scripts/test-moderation-permissions.php'
      - 'scripts/test-stripe-checkout-copy.php'
      - '.github/workflows/storefront-theme-check.yml'
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src php:8.3-cli sh -ec 'find wordpress/themes/souq-qareeb -type f -name "*.php" -exec php -l {} \;'

      - name: Check optional catalog price filters
        run: docker run --rm -v "$PWD:/src:ro" -w /src php:8.3-cli php scripts/test-catalog-filters.php

      - name: Test community listing inventory rules
        run: docker run --rm -v "$PWD:/src:ro" -w /src php:8.3-cli php scripts/test-listing-inventory.php

      - name: Test international contact links and moderation permissions
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src php:8.3-cli php scripts/test-contact-phone.php
          docker run --rm -v "$PWD:/src:ro" -w /src php:8.3-cli php scripts/test-moderation-permissions.php

      - name: Test Arabic Stripe save-card copy
        run: docker run --rm -v "$PWD:/src:ro" -w /src php:8.3-cli php scripts/test-stripe-checkout-copy.php
