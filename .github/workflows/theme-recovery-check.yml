name: Theme backup tooling checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/theme-records.sh
      - run: docker run --rm -v "$PWD:/work:ro" -w /work php:8.3-cli php -l scripts/theme-records.php
